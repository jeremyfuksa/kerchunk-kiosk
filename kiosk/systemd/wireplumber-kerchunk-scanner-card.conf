# Kerchunk appliance: keep WirePlumber off the scanner's audio card.
#
# The built-in analog card (CS4208, ALSA name "PCH") is the scanner's exclusive
# output — the GNU Radio helper opens plughw:CARD=PCH,DEV=0 directly, and the
# backend owns its ALSA "Master" control (config.audio.volume/muted, applied at
# boot and on every /api/audio/* call).
#
# Left enabled, WirePlumber claims the card at login and writes its own route
# volume onto that same Master control. At boot it wins the race (the helper
# takes seconds to build its flowgraph), so the hardware ends up at WirePlumber's
# `device.routes.default-sink-volume` — 0.064 linear = -23.9 dB = ALSA step 80 —
# while the backend's config, and therefore the admin volume slider, still hold
# the operator's setting. Slider and hardware then disagree, and the next drag
# snaps the volume by the whole gap.
#
# Matching on api.alsa.card.name rather than the PCI path, for the same reason
# the sink and mixer are card-name addressed: indices and paths are not stable.
# It carries the ALSA card *name* ("HDA Intel PCH"), not the short id ("PCH"),
# so this is a "~" regex anchored on the id — an exact "PCH" silently never
# matches, and `alsa.id` is not yet set when the monitor evaluates its rules.
# HDMI (a separate card) is untouched and stays available to PipeWire.
#
# Verify after changing: `systemctl --user restart wireplumber` should log
# "ALSA card/device alsa_card.<path> disabled" from s-monitors.
monitor.alsa.rules = [
  {
    matches = [ { api.alsa.card.name = "~.*\\bPCH$" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
