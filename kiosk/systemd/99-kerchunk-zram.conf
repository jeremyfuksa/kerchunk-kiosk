# Install to /etc/sysctl.d/99-kerchunk-zram.conf
# VM tuning for a 2GB kiosk Pi whose swap is zram (compressed in-RAM, zstd).
# zram is fast and compresses well (~4-5x), so prefer swapping anon pages to it
# over evicting file cache, with no swap readahead.
vm.swappiness=100
vm.page-cluster=0
vm.vfs_cache_pressure=60
